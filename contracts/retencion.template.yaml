# Contrato YAML para emitir una retencion ATS.
# Este archivo describe datos tributarios del comprobante.
# No pongas aqui secretos ni configuracion tecnica del runtime.
#
# Sigue en variables de entorno:
# - FEEC_AMBIENTE
# - FEEC_P12_PATH
# - FEEC_P12_PASSWORD
# - FEEC_FACTURA_XSD_PATH
# - FEEC_RETENCION_XSD_PATH
# - FEEC_AUTORIZACION_INTENTOS
# - FEEC_AUTORIZACION_ESPERA_SEGUNDOS
#
# Uso:
# FEEC_P12_PASSWORD="TU_PASSWORD" FEEC_AMBIENTE="1" \
# poetry run python test_retencion.py --contract contracts/retencion.template.yaml

version: 1

retencion:
  # Cambia en cada retencion.
  fecha_emision: "16/03/2026"
  secuencial: "000000123"
  tipo_emision: "1"
  output_xml: "retencion_firmada.xml"

  emisor:
    # Normalmente estos datos cambian poco.
    ruc: "0103523908001"
    razon_social: "PINEDA ALVAREZ DANIEL FERNANDO"
    nombre_comercial: "PINEDA ALVAREZ DANIEL FERNANDO"
    estab: "001"
    pto_emi: "001"
    dir_matriz: "Av. Principal 123"
    dir_establecimiento: "Av. Secundaria 456"
    obligado_contabilidad: "NO"
    # agente_retencion: "001"
    # contribuyente_especial: ""
    # contribuyente_rimpe: ""

  sujeto_retenido:
    # Cambia en cada proveedor retenido.
    tipo_identificacion: "04"
    identificacion: "0104228093001"
    razon_social: "NOMBRE DEL PROVEEDOR"
    parte_rel: "NO"
    # tipo_sujeto_retenido: ""

  documentos_sustento:
    # Puedes incluir uno o mas documentos sustento.
    - cod_sustento: "01"
      cod_doc_sustento: "01"
      num_doc_sustento: "001002000004725"
      fecha_emision_doc_sustento: "16/03/2026"
      fecha_registro_contable: "16/03/2026"
      num_aut_doc_sustento: "1603202601010422809300120010020000047251234567812"
      pago_loc_ext: "01"

      # Montos del documento sustento.
      total_sin_impuestos: "43.91"
      importe_total: "50.50"

      impuestos_doc_sustento:
        - cod_impuesto_doc_sustento: "2"
          codigo_porcentaje: "4"
          base_imponible: "43.91"
          tarifa: "15.00"
          valor_impuesto: "6.59"

      # Define aqui las retenciones aplicables a esa compra.
      retenciones:
        - codigo: "1"
          codigo_retencion: "304A"
          base_imponible: "43.91"
          porcentaje_retener: "10.000000"
          valor_retenido: "4.39"
        - codigo: "2"
          codigo_retencion: "2"
          base_imponible: "6.59"
          porcentaje_retener: "70.000000"
          valor_retenido: "4.61"

      pagos:
        - forma_pago: "19"
          total: "50.50"

  # Opcional.
  info_adicional:
    - nombre: "email"
      valor: "cliente@ejemplo.com"
    - nombre: "referencia"
      valor: "RET-000000123"
