[project]
name = "fe-ec"
version = "0.1.0"
description = "Librería para la generación y envío de facturas electrónicas en Ecuador según normativa del SRI"
authors = [
    {name = "OpenLatina",email = "openlatina.cue@gmail.com"}
]
readme = "README.md"
repository = "https://github.com/angie1590/fe_ec.git"
keywords = ["facturación electrónica", "Ecuador", "SRI", "firma digital"]

[tool.poetry.dependencies]
python = ">=3.8.1,<3.11"
requests = "^2.31.0"
lxml = "^4.9.3"
cryptography = "^41.0.3"
xmlsec = "^1.3.12"
pydantic = "^2.1.1"
xmlschema = "^3.4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
black = "^23.1.0"
flake8 = "^6.1.0"
responses = "^0.25.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
